server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow Service Worker and PWA
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data:; worker-src 'self'; connect-src 'self' https:;" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /transfer-channel-rss/sw.js {
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /transfer-channel-rss/index.html;
}
