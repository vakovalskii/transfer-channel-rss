name: Sync Telegram Channel

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Fetch Telegram channel
        run: pnpm run fetch
        env:
          CHANNEL: ${{ secrets.CHANNEL || 'neuraldeep' }}
          TELEGRAM_HOST: ${{ secrets.TELEGRAM_HOST || 't.me' }}

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "sync: update channel data"

      - name: Build static site
        run: pnpm run build
        env:
          CHANNEL: ${{ secrets.CHANNEL || 'neuraldeep' }}
          LOCALE: ru
          TIMEZONE: Europe/Moscow
          REACTIONS: 'true'

      - name: Commit dist
        run: |
          git add dist/
          git diff --staged --quiet || git commit -m "build: update static site"

      - name: Push to GitHub
        run: git push origin main

      - name: Push to SourceCraft
        run: |
          git remote add sourcecraft https://oauth2:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/${{ secrets.SOURCECRAFT_REPO }}.git 2>/dev/null || true
          git push sourcecraft main:master --force
        continue-on-error: true
